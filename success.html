<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>결제 확인 | 혼자 일해도 팀처럼</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFCF4;color:#1E1E1C;font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.7;word-break:keep-all}
a{color:#1E1E1C}
.wrap{max-width:520px;margin:0 auto;padding:72px 20px}
.card{background:#fff;border:2px solid #1E1E1C;border-radius:26px;padding:32px 26px}
.badge{display:inline-block;padding:6px 14px;border-radius:999px;background:#C8F25A;border:2px solid #1E1E1C;font-weight:900;font-size:14px}
h1{margin:16px 0 8px;font-size:28px;font-weight:900;letter-spacing:-0.02em}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #EFE9DA;font-size:15px}
.btn{display:block;margin-top:24px;text-align:center;text-decoration:none;background:#1E1E1C;color:#fff;padding:15px;border-radius:14px;font-weight:700}
.muted{color:#4A4A44}
</style>
</head>
<body>
<main class="wrap">
<div class="card" id="box">
<p class="badge">확인 중</p>
<h1>결제를 확인하고 있어요</h1>
<p class="muted">잠시만 기다려 주세요. 이 창을 닫지 마세요.</p>
</div>
</main>
<script>
(async function () {
  var box = document.getElementById("box");
  var q = new URLSearchParams(location.search);
  var saved = {}; try { saved = JSON.parse(sessionStorage.getItem("hj_order") || "{}"); } catch (e) {}
  var body = { paymentKey: q.get("paymentKey"), orderId: q.get("orderId"), amount: q.get("amount"), email: saved.email, name: saved.name };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  try {
    var r = await fetch("/api/confirm", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    var d = await r.json();
    if (!d.ok) throw new Error(d.message || "결제 승인에 실패했어요.");
    box.innerHTML =
      '<p class="badge">결제 완료</p>' +
      '<h1>감사합니다!</h1>' +
      (d.mailSent
        ? '<p class="muted">결제하실 때 입력한 이메일로 파일을 보내드렸어요. 몇 분 안에 메일이 안 보이면 스팸함도 확인해 주세요.</p>'
        : '<p class="muted">결제하실 때 입력한 이메일로 24시간 안에 파일을 보내드릴게요. 메일이 안 보이면 스팸함도 확인해 주세요.</p>') +
      '<div style="margin-top:18px">' +
      '<div class="row"><span>상품</span><strong>' + esc(d.orderName) + '</strong></div>' +
      '<div class="row"><span>결제 금액</span><strong>' + Number(d.amount).toLocaleString("ko-KR") + '원</strong></div>' +
      '<div class="row"><span>주문번호</span><span>' + esc(d.orderId) + '</span></div>' +
      '</div>' +
      '<p class="muted" style="margin-top:18px;font-size:14px">문의: <a href="https://pf.kakao.com/_xkXXxeX/chat" target="_blank" rel="noopener">카카오톡 채널</a> · <a href="mailto:hany427@gmail.com">hany427@gmail.com</a></p>' +
      '<a class="btn" href="/">처음으로</a>';
  } catch (e) {
    box.innerHTML =
      '<p class="badge" style="background:#FFD5CC">확인 필요</p>' +
      '<h1>결제 확인에 실패했어요</h1>' +
      '<p class="muted">' + esc(e.message) + '</p>' +
      '<p class="muted" style="font-size:14px">카드 결제가 됐는데 이 화면이 보인다면 주문번호와 함께 <a href="https://pf.kakao.com/_xkXXxeX/chat" target="_blank" rel="noopener">카카오톡 채널</a>이나 <a href="mailto:hany427@gmail.com">hany427@gmail.com</a>으로 알려주세요.</p>' +
      '<p class="muted" style="font-size:13px">주문번호: ' + esc(body.orderId) + '</p>' +
      '<a class="btn" href="/">처음으로</a>';
  }
})();
</script>
</body>
</html>
